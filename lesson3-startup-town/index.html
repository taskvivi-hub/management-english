<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Startup Town · The Smart Lunch Box Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#9ed77b; --panel:#fffdf6; --ink:#2b3a4f; --muted:#66768c; --line:#e6dcc4;
  --story:#eef5ff; --bubble:#fff3dc; --bubble-line:#f0cf96; --chip-bg:#e6f4dc; --chip-ink:#3c7a35;
  --accent:#3f74d6; --accent-ink:#ffffff; --accent-shadow:#2a54a3; --soft:#eef2fb; --soft-ink:#33579c;
  --gold:#f2a43a; --zh-bg:#f3f5f9; --zh-ink:#52637a; --good:#3aa86b; --scrim:rgba(30,52,36,.45);
  --card:#ffffff; --sel:#e8f0ff; --sel-line:#4d6fd2;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#26382a; --panel:#1f2734; --ink:#e9eef6; --muted:#a4b1c3; --line:#37435c;
    --story:#24304a; --bubble:#3a2f1f; --bubble-line:#6e5530; --chip-bg:#26402a; --chip-ink:#b6e3a8;
    --accent:#6b93ee; --accent-ink:#0e1626; --accent-shadow:#3d5fae; --soft:#2a3550; --soft-ink:#cad8ff;
    --zh-bg:#2a3243; --zh-ink:#c3cddc; --scrim:rgba(6,12,9,.62); --card:#273145; --sel:#2c3c66; --sel-line:#8aa6ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#26382a; --panel:#1f2734; --ink:#e9eef6; --muted:#a4b1c3; --line:#37435c;
  --story:#24304a; --bubble:#3a2f1f; --bubble-line:#6e5530; --chip-bg:#26402a; --chip-ink:#b6e3a8;
  --accent:#6b93ee; --accent-ink:#0e1626; --accent-shadow:#3d5fae; --soft:#2a3550; --soft-ink:#cad8ff;
  --zh-bg:#2a3243; --zh-ink:#c3cddc; --scrim:rgba(6,12,9,.62); --card:#273145; --sel:#2c3c66; --sel-line:#8aa6ff;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.6 Nunito,"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Baloo 2",Nunito,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.15}
#game{position:relative;width:100%;height:100%;overflow:hidden}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.hidden{display:none!important}

/* HUD */
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
.hud-left{display:flex;flex-direction:column;gap:8px;max-width:250px}
.pill{align-self:flex-start;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font:800 18px/1.5 "Baloo 2",Nunito,sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.pill small{font-size:13px;color:var(--muted);margin-left:2px}
.quest{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:9px 12px 10px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.q-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:800}
.q-name{font:800 17px/1.25 "Baloo 2",Nunito,sans-serif;margin-top:2px}
.q-zh{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px;margin:7px 0 8px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.dot.done{background:var(--good)}
.dot.now{background:var(--gold);box-shadow:0 0 0 3px rgba(242,164,58,.3)}
.gobtn{width:100%;border:0;border-radius:11px;background:var(--soft);color:var(--soft-ink);font:800 13px Nunito,sans-serif;padding:6px 8px;cursor:pointer}
.hud-right{display:flex;gap:6px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--panel);font-size:19px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12);color:var(--ink)}
#toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,140%);z-index:12;display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--bubble-line);border-radius:20px;padding:8px 16px 8px 8px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-width:min(92vw,460px);transition:transform .35s cubic-bezier(.2,1.3,.4,1);font-size:15px;line-height:1.4}
#toast.show{transform:translate(-50%,0)}
#toast .tz{font-size:13px;color:var(--muted)}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,60px);z-index:11;background:rgba(43,58,79,.86);color:#fff;border-radius:16px;padding:10px 16px;font-size:14px;text-align:center;pointer-events:none;max-width:88vw}

/* Overlays */
.overlay{position:absolute;inset:0;z-index:30;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:16px 12px 28px;-webkit-overflow-scrolling:touch}
.overlay.light{background:rgba(30,52,36,.18)}
.sheet{width:100%;max-width:760px;margin:auto 0;background:var(--panel);border:3px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.10),0 24px 50px rgba(0,0,0,.25);animation:pop .4s cubic-bezier(.2,1.35,.4,1)}
@keyframes pop{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}#toast{transition:none}}
.title-sheet{max-width:560px;text-align:center}
.title-sheet h1{font-size:clamp(38px,8vw,56px);margin:4px 0 0;color:var(--accent)}
.subtitle{font:700 21px/1.3 "Baloo 2",Nunito,sans-serif}
.lesson{font-size:13px;color:var(--muted);font-weight:700}
.cast{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:14px 0 6px}
h2{font-size:25px;margin:6px 0 12px}
h3{font-size:19px;margin:0 0 8px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.chip{display:inline-block;background:var(--chip-bg);color:var(--chip-ink);border-radius:99px;padding:3px 11px;font-size:13px;font-weight:800}
.story{background:var(--story);padding:14px;border-radius:16px;margin:12px 0}
.bubble{background:var(--bubble);border:2px solid var(--bubble-line);border-radius:20px;padding:14px;margin:12px 0}
.who{display:flex;align-items:center;gap:10px;font-weight:800}
.pt{display:inline-block;line-height:0;flex-shrink:0}
.line{display:flex;align-items:flex-start;gap:10px}
.line .words{flex:1;min-width:0}
.trans{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border:2px solid var(--line);border-radius:9px;background:var(--card);color:var(--soft-ink);font-weight:800;cursor:pointer;flex-shrink:0;font-size:13px}
.zh{display:none;color:var(--zh-ink);font-size:14px;background:var(--zh-bg);padding:8px 10px;margin-top:7px;border-radius:9px}
.zh.visible{display:block}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:12px 20px;font:800 16px Nunito,sans-serif;cursor:pointer;box-shadow:0 4px 0 var(--accent-shadow);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-shadow)}
.btn.secondary{background:var(--soft);color:var(--soft-ink);box-shadow:0 4px 0 var(--line)}
.btn.gold{background:#f2b440;color:#3a2a0e;box-shadow:0 4px 0 #c98a1d}
.btn.big{font-size:19px;padding:14px 34px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button:focus-visible{outline:3px solid #ffbf5d;outline-offset:2px}
.reading-tip{display:flex;gap:12px;align-items:flex-start;background:var(--bubble);border:2px solid var(--bubble-line);border-radius:16px;padding:13px;margin:14px 0}
.reading-tip>div:last-child{flex:1;min-width:0}
.tip-icon{font-size:26px}
.tip-rule{font-size:13px;color:var(--muted);margin-top:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.pcard{cursor:pointer;border:3px solid var(--line);border-radius:22px;padding:10px 8px 14px;background:var(--card);text-align:center;font:inherit;color:var(--ink);transition:transform .15s,border-color .15s}
.pcard:hover{border-color:var(--sel-line);transform:translateY(-3px)}
.pcard.sel{border-color:var(--sel-line);background:var(--sel)}
.pcard strong{display:block;font:800 18px/1.2 "Baloo 2",Nunito,sans-serif;margin-top:4px}
.pcard .muted{display:block}
.looks{display:flex;gap:10px;margin:8px 0 4px}
.look{border:3px solid var(--line);border-radius:18px;background:var(--card);padding:4px 6px 6px;cursor:pointer;color:var(--ink);font:800 13px Nunito,sans-serif}
.look.sel{border-color:var(--sel-line);background:var(--sel)}
.sheet-head{display:flex;align-items:center;gap:12px;margin:-22px -22px 14px;padding:14px 18px;border-radius:25px 25px 0 0;color:#fff}
.sheet-head h2{margin:0;color:#fff;font-size:24px}
.sheet-head .eyebrow{font-size:12px;font-weight:800;opacity:.9}
.zhname{font-size:15px;font-weight:700;opacity:.92;margin-left:4px;font-family:Nunito,"PingFang TC","Microsoft JhengHei",sans-serif}
.bigicon{font-size:32px;width:56px;height:56px;border-radius:17px;background:rgba(255,255,255,.25);display:grid;place-items:center;flex-shrink:0}
.close{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
.stats{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800;margin-bottom:8px}
.progress{height:12px;border-radius:10px;background:var(--line);overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,#69a8e9,#42b38a);transition:width .3s}
.decision{border:2px solid var(--line);border-radius:18px;padding:15px;margin:14px 0;background:var(--card)}
.choice{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 14px;margin:9px 0;cursor:pointer;font:inherit;color:var(--ink)}
.choice:hover:not(:disabled){border-color:var(--sel-line)}
.choice.selected{border-color:var(--sel-line);background:var(--sel)}
.choice:disabled{cursor:default}
.choice .zh{font-size:13px}
.result{border-left:6px solid #4d80c5;background:var(--story);padding:13px 15px;border-radius:12px;margin-top:14px}
.score{font:800 40px/1.2 "Baloo 2",Nunito,sans-serif;color:var(--accent);margin:8px 0}
.barrow{display:flex;justify-content:space-between;font-size:15px;padding:8px 0;border-bottom:1px solid var(--line)}
.survey{border:2px dashed var(--line);border-radius:16px;padding:13px;margin:12px 0}
.bonus-success{background:linear-gradient(120deg,#fff3c4,#e5fbef);border:2px solid #f0ca62;border-radius:14px;padding:13px;margin:12px 0;font-weight:800;color:#2f5a3e}
.bonus-pending{background:var(--zh-bg);border-radius:12px;padding:12px;margin:12px 0;color:var(--zh-ink)}
.review{color:#d0563f;font-size:13px;font-weight:800;margin-left:6px}
.namebox{background:var(--bubble);border:2px solid var(--bubble-line);border-radius:16px;padding:14px;margin:14px 0;text-align:left}
.namebox input{display:block;width:100%;margin-top:8px;font:700 20px Nunito,"PingFang TC","Microsoft JhengHei",sans-serif;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.namebox input:focus{outline:3px solid #ffbf5d;outline-offset:1px}
.ceremony{max-width:820px;text-align:center}
.ribbon{display:inline-block;background:#df6890;color:#fff;font:800 19px/1.5 "Baloo 2",Nunito,sans-serif;padding:3px 24px;border-radius:999px;transform:rotate(-2deg);box-shadow:0 3px 0 #b44a6e}
.holders{display:flex;justify-content:center;align-items:flex-end;gap:0;margin-top:4px;position:relative;z-index:1}
.check{position:relative;margin:-30px auto 12px;max-width:720px;border:3px solid #3a8a5c;border-radius:14px;padding:clamp(14px,3.4vw,24px);color:#1f3a2c;text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.14),0 18px 30px rgba(0,0,0,.18);background:repeating-linear-gradient(45deg,rgba(58,138,92,.06) 0 10px,transparent 10px 20px),linear-gradient(135deg,#f5fcf0,#dff2e6);animation:pop .6s cubic-bezier(.2,1.35,.4,1)}
.check::before{content:"";position:absolute;inset:6px;border:1.5px dashed rgba(58,138,92,.45);border-radius:9px;pointer-events:none}
.ck-top{display:flex;justify-content:space-between;gap:10px;font-size:clamp(11px,2.4vw,14px);font-weight:700}
.ck-bank{font:800 clamp(15px,3.4vw,21px)/1.2 "Baloo 2",Nunito,sans-serif}
.ck-no{text-align:right}
.ck-row{display:flex;align-items:flex-end;gap:10px;margin-top:clamp(14px,3.4vw,22px);flex-wrap:wrap}
.ck-lbl{font-size:clamp(11px,2.4vw,14px);font-weight:800;white-space:nowrap}
.ck-name{flex:1;min-width:150px;border-bottom:2px solid #1f3a2c;font:700 clamp(28px,6.4vw,44px)/1.1 Caveat,"Kaiti TC","BiauKai","DFKai-SB","PingFang TC",cursive;color:#1b3f8f;padding:0 6px;word-break:break-word}
.ck-amt{border:2px solid #1f3a2c;border-radius:8px;background:#fff;padding:2px 12px;font:800 clamp(19px,4.6vw,30px)/1.3 "Baloo 2",Nunito,sans-serif}
.ck-words{border-bottom:1.5px solid rgba(31,58,44,.5);margin-top:10px;font:700 clamp(20px,4.4vw,28px)/1.3 Caveat,cursive;padding-left:6px}
.ck-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:clamp(12px,3vw,20px);flex-wrap:wrap}
.ck-memo{font-size:clamp(11px,2.4vw,13px);font-weight:700;line-height:1.5}
.ck-sign{text-align:center;min-width:130px}
.sig{font:700 clamp(30px,6.4vw,42px)/1 Caveat,cursive;color:#1b3f8f}
.sigline{border-top:1.5px solid #1f3a2c;font-size:12px;font-weight:800;padding-top:2px}
.shot{display:inline-block;background:var(--chip-bg);color:var(--chip-ink);font-weight:800;border-radius:12px;padding:8px 14px;margin-top:4px}
@media(max-width:560px){
  .grid3{grid-template-columns:1fr}
  .pcard{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 12px}
  .sheet{padding:17px;border-radius:24px}
  .sheet-head{margin:-17px -17px 12px;border-radius:21px 21px 0 0}
  .sheet-head h2{font-size:20px}
  .btn{width:100%}
  .actions{flex-direction:column}
  .hud-left{max-width:200px}
  .q-name{font-size:15px}
  .quest{padding:7px 10px 8px}
}
</style>
</head>
<body>
<div id="game">
  <canvas id="world" aria-label="Startup Town map. Tap or click to walk."></canvas>
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="pill">⭐ <span id="hScore">0</span><small>/ 100</small></div>
      <div class="quest">
        <div class="q-top"><span>Next stop</span><span id="qCount">1 / 10</span></div>
        <div class="q-name"><span id="qIcon"></span> <span id="qName"></span></div>
        <div class="q-zh" id="qZh"></div>
        <div class="dots" id="dots"></div>
        <button class="gobtn" id="goBtn" onclick="goNext()">📍 Walk there</button>
      </div>
    </div>
    <div class="hud-right">
      <button class="iconbtn" id="sndBtn" onclick="toggleSound()" aria-label="Turn sound on or off">🔊</button>
      <button class="iconbtn" onclick="showHelp()" aria-label="How to play">❓</button>
    </div>
  </div>
  <div id="hint" class="hidden">👆 Tap the ground or a building to walk<br>⌨️ Arrow keys or WASD work too</div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="ov" class="overlay light"></div>
  <canvas id="fx"></canvas>
</div>
<script>
/* ============ LESSON CONTENT ============ */
const DATA={"partners":{"owl":{"name":"Oliver the Owl","role":"Business Planner","intro":"I love numbers and careful plans. Let’s build a strong business!","zh":"我喜歡數字和周全的計畫。我們一起打造成功的事業吧！","advice":["We need experts with the right skills, not just famous people.","Check the costs. Keep the feature customers really need.","Let’s study the survey before we choose our customers.","Our sales forecast must be realistic. Investors will check our numbers.","We should understand the investment terms before agreeing."]},"cat":{"name":"Milo the Cat","role":"Marketing Expert","intro":"I know how to get customers excited. Let’s make our brand famous!","zh":"我知道怎麼讓顧客對產品感到興奮。讓我們打響品牌知名度！","advice":["A good team needs different ideas. I can help with customers!","Colorful lights would look amazing online! But will people pay more?","Students care about price. Maybe we should ask office workers, too.","A big advertising campaign sounds fun, but can we afford it?","An investor could introduce us to more customers. Let’s hear the offer."]},"hamster":{"name":"Hazel the Hamster","role":"Product Engineer","intro":"I love solving problems and building useful products. Let’s get started!","zh":"我喜歡解決問題和打造實用產品。我們開始吧！","advice":["We need an engineer who understands temperature control.","I can simplify the design without losing temperature control.","Students and office workers may need different features.","Our factory cannot make 10,000 lunch boxes in one month yet.","Testing with a small group can help us find problems."]}},
"chapters":[
{"title":"Build Your Dream Team","concept":"A strong management team","take":"A strong management team needs people with useful talents and expertise.","takezh":"強大的管理團隊需要具備實用才能與專業知識的人才。","scene":"You and your partner have started a company. You need a team with the right skills.","scenezh":"你和合夥人創立了一家公司。你們需要具備合適技能的團隊。","questions":[
{"q":"Your Smart Lunch Box needs help with product development. Who should you hire?","zh":"智慧便當盒需要有人協助產品開發。你應該聘請誰？","options":[{"en":"A famous online influencer with no product development experience.","zh":"沒有產品開發經驗的知名網路紅人。","points":0,"feedback":"Popularity may help marketing, but your core product needs technical expertise.","feedbackzh":"知名度可能有助行銷，但核心產品需要技術專業。"},{"en":"An engineer who understands temperature-control technology.","zh":"了解溫控技術的工程師。","points":10,"feedback":"Excellent! Your team needs experts who understand its core product.","feedbackzh":"非常好！你的團隊需要了解核心產品的專家。"},{"en":"A friendly student who is excited to learn about business.","zh":"一位很期待學習商業知識、態度友善的學生。","points":5,"feedback":"Motivation helps, but you still need relevant expertise.","feedbackzh":"積極的態度有幫助，但你仍需要相關專業能力。"}]},

function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
function ell(c,x,y,rx,ry,col,rot=0){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,rot,0,Math.PI*2);c.fill()}
function tri(c,a,b,d,e,f,g,col){c.fillStyle=col;c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.lineTo(f,g);c.closePath();c.fill()}
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mixc(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function shadow(c,x,y,r){ell(c,x,y,r,r*.36,'rgba(30,60,30,.22)')}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function faceOff(d){return d==='right'?3:d==='left'?-3:0}
function eyesAt(c,x,y,d,sp=5){if(d==='up')return;const o=faceOff(d);for(const s of[-1,1]){const far=(d==='right'&&s<0)||(d==='left'&&s>0);const ex=x+s*sp+o,rx=far?2.1:2.6;ell(c,ex,y,rx,3.4,'#2a2230');circ(c,ex+.9,y-1.3,1,'#fff')}}
function blush(c,x,y,d,sp=9){if(d==='up')return;const o=faceOff(d);for(const s of[-1,1])ell(c,x+s*sp+o,y,3.2,2,'rgba(255,120,130,.45)')}
function smile(c,x,y,d){if(d==='up')return;c.strokeStyle='#7a3b35';c.lineWidth=1.4;c.lineCap='round';c.beginPath();c.arc(x+faceOff(d),y-1.5,2.4,.2*Math.PI,.8*Math.PI);c.stroke()}

function nearestWalk(tx,ty){tx=Math.max(0,Math.min(COLS-1,tx));ty=Math.max(0,Math.min(ROWS-1,ty));const seen=new Set([idx(tx,ty)]),q=[[tx,ty]];

const keys={};
function update(dt){
 time+=dt;
 const vw=cw/scale,vh=ch/scale;
 if(S.phase==='title'||S.phase==='select'||S.phase==='intro'){

 }

 if(mx||my){P.path=[];const l=Math.hypot(mx,my);mx/=l;my/=l;
  if(freeAt(P.x+mx*sp,P.y))P.x+=mx*sp;if(freeAt(P.x,P.y+my*sp))P.y+=my*sp;
  P.moving=true;P.dir=Math.abs(mx)>Math.abs(my)?(mx<0?'left':'right'):(my<0?'up':'down')}
 else if(P.path.length&&!S.modal){const n=P.path[0],dx=n.x-P.x,dy=n.y-P.y,dd=Math.hypot(dx,dy);
  if(dd<=sp){P.x=n.x;P.y=n.y;P.path.shift()}else{P.x+=dx/dd*sp;P.y+=dy/dd*sp}
  P.moving=true;if(dd>.5)P.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down')}
 else P.moving=false;
 P.ph+=dt*(P.moving?12:3);
 const lt=trail[trail.length-1];if(!lt||Math.hypot(P.x-lt.x,P.y-lt.y)>3)trail.push({x:P.x,y:P.y});if(trail.length>80)trail.shift();
 const tg=trail[Math.max(0,trail.length-12)];
 if(tg){const dx=tg.x-F.x,dy=tg.y-F.y,dd=Math.hypot(dx,dy),fs=SPEED*1.08*dt;
  if(dd>2){const st=Math.min(dd,fs);F.x+=dx/dd*st;F.y+=dy/dd*st;F.moving=true;F.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down')}
  else{F.moving=false;if(!P.moving)F.dir=P.dir==='up'?'up':F.dir}}
 F.ph+=dt*(F.moving?12:3);
 if(S.phase==='play')checkTrig();
 let tx=P.x-vw/2,ty=P.y-30-vh/2;tx=clampCam(tx,vw,W);ty=clampCam(ty,vh,H);

}

 showOv(`<div class="sheet"><div class="sheet-head" style="background:${mixc(b.roof,'#000000',.18)}"><div class="bigicon">${b.icon}</div><div><div class="eyebrow">Chapter ${ch_+1} of 5 · Center ${bi+1} of 10</div><h2>${b.name}<span class="zhname">${b.zh}</span></h2></div><button class="close" id="closeX" aria-label="Back to town without answering" onclick="closeCenter()">✕</button></div>
 <div class="stats"><span>Decision ${bi+1} / 10</span><span>⭐ ${S.score} / 100</span></div><div class="progress"><div style="width:${bi*10}%"></div></div>
 <h2 style="margin-top:14px">${c.title}</h2><span class="chip">${c.concept}</span>
 <div class="story"><strong>📖 The story</strong>${tr(c.scene,c.scenezh)}${previous?`<div style="margin-top:9px">${tr(previous,previousZh)}</div>`:''}</div>
 <div class="bubble"><div class="who">${pt(S.partner,52)}<span>${p.name} says…</span></div>${tr('“'+p.advice[ch_]+'”',ADVICE_ZH[S.partner][ch_])}
 <button class="btn secondary" style="padding:6px 12px;margin-top:10px;font-size:13px;width:auto" onclick="toggleNext(this)">💬 Discuss with partner</button><div class="zh">${NOTES[S.partner][ch_]}</div></div>
 ${ch_===2?`<div class="survey"><strong>📊 Student survey (100 students)</strong><div class="muted small">Practice survey in this startup story</div>${[['Affordable price',40],['Useful features',30],['Easy to use',20],['Good design',10]].map(([k,v])=>`<div class="barrow"><span>${k}</span><strong>${v}%</strong></div>`).join('')}</div>`:''}
 <div class="decision"><h3>🎯 Your decision</h3>${tr(q.q,q.zh)}
 <div style="margin-top:12px"><strong class="small">Choose ONE answer:</strong></div>
 <div id="options">${q.options.map((o,i)=>`<button class="choice" onclick="choose(${i})"><strong>${'ABC'[i]}.</strong> ${o.en}</button>`).join('')}</div>
 <div id="feedback"></div></div><div id="next" class="actions hidden"></div></div>`);
}
function closeCenter(){if(S.answered)return;hideOv();S.modal=false;say('Take your time. Tap the building when you are ready.','慢慢來，準備好再點建築物。')}
function choose(i){
 if(S.answered)return;S.answered=true;const bi=S.openB,qn=bi%2,o=DATA.chapters[Math.floor(bi/2)].questions[qn].options[i];
 S.score+=o.points;S.answers[bi]={points:o.points,answer:i};updateHUD();
 document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(i===j)b.classList.add('selected')});$('closeX').style.display='none';
 const label=o.points===10?'🌟 Strong decision':o.points===5?'🟡 Fair decision':'🔎 Risky decision';
 if(o.points===10)beep([659,784,1047]);else if(o.points===5)beep([523,587]);else beep([392,330],.12,'triangle');
 $('feedback').innerHTML=`<div class="result"><strong>${label} · +${o.points} points</strong><div style="margin-top:7px">${tr(o.feedback,o.feedbackzh)}</div><p class="muted small" style="margin:8px 0 0">Investment confidence: ${S.score} / 100</p></div>`;
 const nx=$('next');nx.classList.remove('hidden');
 nx.innerHTML=qn===0?`<button class="btn" onclick="leaveCenter()">Back to town</button>`:`<button class="btn" onclick="chapterDone()">📚 Finish chapter ${Math.floor(bi/2)+1}</button>`;
 setTimeout(()=>nx.scrollIntoView({behavior:'smooth',block:'nearest'}),80);
}
function chapterDone(){
 const ch_=Math.floor(S.openB/2),c=DATA.chapters[ch_],pts=(S.answers[ch_*2]?.points||0)+(S.answers[ch_*2+1]?.points||0);beep([523,659,784,1047],.08);
 showOv(`<div class="sheet" style="text-align:center"><span class="chip">Chapter ${ch_+1} complete</span><h2>📚 What you learned</h2><div style="text-align:left">${tr(c.take,c.takezh)}</div>
 <p class="score">${pts} / 20</p><div class="bubble" style="text-align:left"><div class="who">${pt(S.partner,52)}<span>${DATA.partners[S.partner].name}: “${ch_===4?'We did it! Let’s hear what Alex decides.':'We are one step closer to meeting our investor!'}”</span></div></div>
 <div class="actions" style="justify-content:center">${ch_===4?`<button class="btn gold" onclick="finish()">🏆 See the investment result</button>`:`<button class="btn" onclick="leaveCenter()">Back to town</button>`}</div></div>`);
 burst(cw/2,ch*.35,40);
}
function leaveCenter(){
 const bi=S.openB;hideOv();S.modal=false;S.current=bi+1;updateHUD();
 const b=CENTERS[bi];burst((b.doorX-camX)*scale,((b.y)*T-camY)*scale,30);
 if(S.current<10){const n=CENTERS[S.current];setTimeout(()=>say(`Nice work! Next stop: ${n.icon} ${n.name}.`,`做得好！下一站：${n.zh}。`),350)}
}
let studentName='';try{studentName=localStorage.getItem('startupTownName')||''}catch(e){}
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function ckCode(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36).toUpperCase().padStart(6,'0').slice(0,6)}
function reportHTML(){
 return `<div style="text-align:left;margin-top:18px"><h2>📋 Startup performance report</h2>${DATA.chapters.map((c,i)=>{const pts=(S.answers[i*2]?.points||0)+(S.answers[i*2+1]?.points||0);return `<div class="barrow"><span>${CENTERS[i*2].icon} ${c.title}${pts<15?'<span class="review">🔁 Review</span>':''}</span><strong>${pts}/20</strong></div>`}).join('')}
 <p class="muted">Review any chapter below 15 points. Venture capitalists look for a strong team, a unique product, a growing market, a good business plan, and founders who accept guidance.</p>
 ${tr('Silicon Valley is a famous center for technology startups and venture capital. The reading also describes Sequoia Capital’s early investment in Google. VCs consider both potential returns and an exit strategy.','')}</div>`;
}
function finish(){
 S.current=10;S.phase='done';S.modal=true;updateHUD();
 if(S.score>best){best=S.score;try{localStorage.setItem('startupTownBest',best)}catch(e){}}
 const sc=S.score,p=DATA.partners[S.partner];
 if(sc>=90){
  showOv(`<div class="sheet" style="text-align:center"><div style="font-size:58px;line-height:1.2">🏆</div><h2>🎉 Investment approved!</h2><p class="score">${sc} / 100</p>
  <div class="story" style="text-align:left"><div class="who" style="margin-bottom:6px">${pt('alex',56)}<span>Investor Alex</span></div>${tr('“Your startup shows strong potential. I am ready to invest! Please write your name, and I will give you the check.”','')}</div>
  <div class="namebox"><label for="stuName"><strong>✍️ Write your name on the check</strong></label><input id="stuName" maxlength="40" value="${esc(studentName)}" placeholder="Your name" autocomplete="name" onkeydown="if(event.key==='Enter'){event.preventDefault();showCheck()}"><div id="nameErr" class="small" style="color:#d0563f;font-weight:800;margin-top:6px"></div></div>
  <div class="actions" style="justify-content:center"><button class="btn gold big" onclick="showCheck()">💰 Get my check</button></div></div>`);
  setTimeout(()=>{const i=$('stuName');if(i)i.focus({preventScroll:true})},120);
  beep([523,659,784,1047],.09);burst(cw/2,ch*.3,50);
 } else {
  const msg=sc>=60?'I like your idea, but improve your business plan and come back.':'Your startup is not ready for investment yet. Learn from your decisions and try again!';
  showOv(`<div class="sheet" style="text-align:center"><div style="font-size:58px;line-height:1.2">💪</div><h2>Not funded yet. Try again!</h2><p class="score">${sc} / 100</p>
  <div class="bonus-pending">🎯 You need <strong>${90-sc} more points</strong>. Score 90 or higher to win the investment and get your check!</div>
  <div class="story" style="text-align:left"><div class="who" style="margin-bottom:6px">${pt('alex',56)}<span>Investor Alex</span></div>${tr('“'+msg+'”','')}</div>
  <div class="bubble" style="text-align:left"><div class="who">${pt(S.partner,52)}<span>${p.name}: “Let’s look at our report, learn from our decisions, and try again. We can do it!”</span></div></div>
  <div class="actions" style="justify-content:center"><button class="btn gold big" onclick="tryAgain()">🔄 Try again</button><button class="btn secondary" onclick="restart()">Choose another partner</button></div>
  ${reportHTML()}</div>`);
  beep([440,392,349],.14,'triangle');
 }
}
function showCheck(){
 const inp=$('stuName'),n=(inp?inp.value:'').trim();
 if(!n){$('nameErr').textContent='Please type your name first.';inp.focus();return}
 studentName=n;try{localStorage.setItem('startupTownName',n)}catch(e){}
 const sc=S.score,p=DATA.partners[S.partner],d=new Date(),dateStr=d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),timeStr=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),code=ckCode(n+'|'+sc+'|'+dateStr);
 showOv(`<div class="sheet ceremony"><div class="ribbon">🎉 Congratulations! 🎉</div><h2 style="margin-top:10px">You won the investment!</h2>
 <div class="holders">${pt(S.partner,104)}${pt('player',128,S.look)}${pt('alex',104)}</div>
 <div class="check" role="img" aria-label="Investment check for ${esc(n)}, one million dollars">
  <div class="ck-top"><div class="ck-bank">🏦 Startup Town Venture Capital</div><div class="ck-no">No. ST-${code}<br>${dateStr} · ${timeStr}</div></div>
  <div class="ck-row"><span class="ck-lbl">Pay to the order of</span><span class="ck-name">${esc(n)}</span><span class="ck-amt">$1,000,000</span></div>
  <div class="ck-words">One million dollars and 00/100</div>
  <div class="ck-bottom"><div class="ck-memo">Memo: Smart Lunch Box · Seed investment<br>Score ⭐ ${sc} / 100 · Co-founder: ${p.name}</div><div class="ck-sign"><div class="sig">Alex</div><div class="sigline">Investor Alex</div></div></div>
 </div>
 <div class="shot">📸 Take a screenshot of this check and send it to your teacher!</div>
 <div class="actions" style="justify-content:center"><button class="btn secondary" onclick="finish()">✏️ Change my name</button><button class="btn" onclick="restart()">🔄 Play again</button></div>
 ${reportHTML()}</div>`);
 rain();beep([523,659,784,1047,1319],.1);
}
function tryAgain(){S.current=0;S.score=0;S.answers=[];S.openB=-1;parts=[];startPlay()}
function restart(){S.partner=null;S.current=0;S.score=0;S.answers=[];S.modal=false;S.openB=-1;parts=[];$('hud').classList.add('hidden');selectScreen()}

/* ============ BOOT ============ */
cv=$('world');ctx=cv.getContext('2d');fxc=$('fx');fx=fxc.getContext('2d');
cv.addEventListener('pointerdown',onTap);
addEventListener('resize',resize);
resize();titleScreen();requestAnimationFrame(frame);
</script>
</body>
</html>
